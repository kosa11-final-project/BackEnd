spring:
  datasource:
    url: jdbc:h2:mem:stockit;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always
  flyway:
    enabled: false

app:
  ai-strategy:
    messaging:
      enabled: false
