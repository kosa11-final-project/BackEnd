spring:
  application:
    name: stockit-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  flyway:
    # 이 브랜치는 이미 존재하는 공유 스키마를 읽기 전용으로 확인합니다.
    # migration 실행은 별도 승인된 작업에서만 명시적으로 켭니다.
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 1
        max-concurrency: 1
        prefetch: 1
        default-requeue-rejected: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

logging:
  pattern:
    # 요청 로그와 예외 응답의 requestId를 같은 값으로 연결합니다.
    level: "%5p [requestId:%X{requestId:-}]"

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  internal-api:
    key: ${STOCKIT_INTERNAL_API_KEY:}
    user-id: ${STOCKIT_INTERNAL_API_USER_ID:0}
    principal-name: ${STOCKIT_INTERNAL_API_PRINCIPAL:ml-service}
  sales-daily-export:
    # Path 바인딩이 실패하지 않도록 Backend 프로젝트 기준의 유효한 기본 경로를 사용합니다.
    output-path: ${SALES_DAILY_EXPORT_PATH:./build/exports/sales_daily.csv}
    destination: ${SALES_DAILY_EXPORT_DESTINATION:LOCAL}
    azure:
      account-url: ${AZURE_STORAGE_ACCOUNT_URL:}
      container-name: ${AZURE_STORAGE_CONTAINER:}
      blob-prefix: ${AZURE_STORAGE_BLOB_PREFIX:sales-daily}
  ai-strategy:
    messaging:
      enabled: ${AI_STRATEGY_MESSAGING_ENABLED:true}
      max-attempts: ${AI_STRATEGY_MAX_ATTEMPTS:3}
      retry-delay: ${AI_STRATEGY_RETRY_DELAY:30s}
      confirm-timeout: ${AI_STRATEGY_CONFIRM_TIMEOUT:5s}

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  type-aliases-package: com.stockit.backend.feature.*.vo
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local
  rabbitmq:
    username: ${RABBITMQ_USERNAME:stockit_local}
    password: ${RABBITMQ_PASSWORD:stockit_local}

server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
