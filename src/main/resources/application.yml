spring:
  application:
    name: stockit-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  internal-api:
    key: ${STOCKIT_INTERNAL_API_KEY:}
    user-id: ${STOCKIT_INTERNAL_API_USER_ID:0}
    principal-name: ${STOCKIT_INTERNAL_API_PRINCIPAL:ml-service}
  sales-daily-export:
    output-path: ${SALES_DAILY_EXPORT_PATH:../dummy-data/ml/data/raw/sales_daily.csv}
    destination: ${SALES_DAILY_EXPORT_DESTINATION:LOCAL}
    azure:
      account-url: ${AZURE_STORAGE_ACCOUNT_URL:}
      container-name: ${AZURE_STORAGE_CONTAINER:}
      blob-prefix: ${AZURE_STORAGE_BLOB_PREFIX:sales-daily}

mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  type-aliases-package: com.stockit.backend.feature.*.vo
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: local

server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
