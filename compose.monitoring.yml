name: stockit-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: stockit-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - stockit-prometheus-data:/prometheus
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.3
    container_name: stockit-loki
    command:
      - -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - stockit-loki-data:/loki
    restart: unless-stopped

  incident-analyzer:
    build:
      context: ./infra/incident-analyzer
    container_name: stockit-incident-analyzer
    env_file:
      - path: ${INCIDENT_ANALYZER_ENV_FILE:-./infra/env/incident-analyzer.env}
        required: false
    environment:
      INCIDENT_LOKI_BASE_URL: http://loki:3100
      INCIDENT_PROMETHEUS_BASE_URL: http://prometheus:9090
    depends_on:
      - loki
      - prometheus
    expose:
      - "8080"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    container_name: stockit-grafana
    depends_on:
      - prometheus
      - loki
      - incident-analyzer
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-stockit_local}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - stockit-grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  stockit-prometheus-data:
  stockit-grafana-data:
  stockit-loki-data:
